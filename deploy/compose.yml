# حزمة التشغيل على الخادم: القاعدة والموقع وCaddy (يصدر شهادة HTTPS تلقائيًا ويوجّه إلى الموقع).
# القيم السرية في deploy/.env على الخادم فقط (ينشئه bootstrap.sh، وهو خارج git).
name: masar

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: masar
      POSTGRES_DB: masar
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masar -d masar"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://masar:${DB_PASSWORD}@db:5432/masar
      SITE_URL: ${SITE_URL:?SITE_URL is required}
      SITE_INDEXABLE: ${SITE_INDEXABLE:-false}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-}
      # الشراء والدفع مغلقان ما لم تُكتب قيمهما في deploy/.env على الخادم (docs/PAYMENTS.md)
      CHECKOUT_ENABLED: ${CHECKOUT_ENABLED:-}
      CHECKOUT_PREVIEW: ${CHECKOUT_PREVIEW:-}
      PAYMENTS_MODE: ${PAYMENTS_MODE:-}
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-}
      PAYMENTS_MIN_PAYMENT_MINUTES: ${PAYMENTS_MIN_PAYMENT_MINUTES:-}
      MOYASAR_SECRET_KEY: ${MOYASAR_SECRET_KEY:-}
      MOYASAR_WEBHOOK_SECRET: ${MOYASAR_WEBHOOK_SECRET:-}
      MOYASAR_HOSTED_PAGE_ORIGIN: ${MOYASAR_HOSTED_PAGE_ORIGIN:-}
      PAYMENTS_PUBLIC_SANDBOX: ${PAYMENTS_PUBLIC_SANDBOX:-}
      # لوحة التحكم مغلقة (404) ما لم يُكتب مفتاحها في deploy/.env على الخادم (docs/DEPLOYMENT.md)
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:-}
      # مكتبة الصور على وحدة media-data (docs/ADMIN_A3_SLIDER.md §6.4). الرفع مطفأ ما لم يُكتب
      # MEDIA_UPLOADS=yes في deploy/.env. BACKUP_CONFIGURED قديم: سجل النسخ الآلي يغني عنه (docs/BACKUP.md §9)
      MEDIA_DIR: /var/lib/masar/media
      MEDIA_UPLOADS: ${MEDIA_UPLOADS:-}
      BACKUP_CONFIGURED: ${BACKUP_CONFIGURED:-}
      # سجل النسخ الاحتياطي الآلي (docs/BACKUP.md §9): يكتبه backup.sh ويقرؤه الموقع للقراءة فقط
      BACKUP_STATUS_DIR: /var/lib/masar/backup
    volumes:
      - media-data:/var/lib/masar/media
      - backup-status:/var/lib/masar/backup:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOST: ${SITE_HOST:?SITE_HOST is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # النسخ الاحتياطي المشفر خارج الخادم (docs/BACKUP.md). لا يعمل مع `up`: يشغّله deploy/backup/backup.sh
  # بـ`docker compose run` من مؤقت systemd. صورة restic الرسمية مثبّتة بالإصدار والبصمة (القرار 80).
  backup:
    image: restic/restic:0.20.0@sha256:93999df80d4ac6cb148e82d2ef1fe6a81996f17ff535e772723538211b31555a
    profiles: ["backup"]
    hostname: masar
    environment:
      # أسماء restic الرسمية؛ القيم في deploy/.env على الخادم وحده
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      # اسم ثابت للقطات: الحاوية تتغير كل دورة، وrestic يختار اللقطة الأم بالاسم
      RESTIC_HOST: masar
      RESTIC_CACHE_DIR: /cache
    volumes:
      - media-data:/backup/media:ro
      - backup-status:/status
      - backup-cache:/cache

volumes:
  db-data:
  # الصور المرفوعة: لا توجد إلا هنا، فتدخل النسخة الاحتياطية مع القاعدة
  media-data:
  caddy-data:
  caddy-config:
  # سجل آخر نسخة وفحص وتجربة استرجاع (JSON صغير)، وذاكرة restic المؤقتة (فهارس مشفرة، قابلة لإعادة البناء)
  backup-status:
  backup-cache:
