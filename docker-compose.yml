# بيئة التطوير المحلية فقط (قاعدة البيانات). النشر للإنتاج له ملفه في المرحلة 5.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: masar
      POSTGRES_PASSWORD: masar
      POSTGRES_DB: masar_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masar -d masar_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
