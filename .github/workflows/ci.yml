name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests, build, browser
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: masar
          POSTGRES_PASSWORD: masar
          POSTGRES_DB: masar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U masar -d masar_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # قاعدة اختبار مؤقتة داخل CI فقط — ليست أسرارًا
      DATABASE_URL: postgresql://masar:masar@127.0.0.1:5432/masar_test
      SITE_URL: http://127.0.0.1:3100
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (lockfile must match)
        run: pnpm install --frozen-lockfile

      - name: Dependency vulnerabilities (high and above block)
        run: pnpm audit --prod --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      - name: Types
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Backup scripts (shellcheck)
        run: shellcheck -x deploy/*.sh deploy/backup/*.sh

      # restic الرسمي بالإصدار نفسه المثبّت في deploy/compose.yml وببصمته من SHA256SUMS الموقَّع (القرار 80)،
      # لاختبار النسخ ثم الاسترجاع الحقيقي في test:integration
      - name: Install restic (pinned, checksum verified)
        env:
          RESTIC_VERSION: "0.20.0"
          RESTIC_SHA256: 0ccd9fa7885074a24603b051e01bf9bd8b5e45d6a1791e9d9887e9e9372107f7
        run: |
          curl -fsSLo restic.bz2 "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_linux_amd64.bz2"
          echo "${RESTIC_SHA256}  restic.bz2" | sha256sum -c -
          bunzip2 restic.bz2
          sudo install -m 755 restic /usr/local/bin/restic
          rm restic
          restic version

      # أدوات PostgreSQL 16 في صورة ubuntu-latest؛ بلاها يفشل اختبار النسخ بدل أن يُتخطى صامتًا
      - name: PostgreSQL client tools
        run: pg_dump --version && pg_restore --version && psql --version

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Integration tests (real PostgreSQL)
        run: pnpm test:integration
        env:
          BACKUP_TESTS_REQUIRED: "yes"

      - name: Production build
        run: pnpm build

      - name: Install browser
        run: pnpm --filter @masar/web exec playwright install --with-deps chromium

      - name: Demo catalog for browser tests
        run: pnpm db:seed:demo
        env:
          SEED_DEMO_DATA: "yes"

      - name: Browser tests (production build, accessibility, seven screen sizes)
        run: pnpm e2e

      - name: Keep screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: apps/web/screens
          retention-days: 14
          if-no-files-found: ignore
